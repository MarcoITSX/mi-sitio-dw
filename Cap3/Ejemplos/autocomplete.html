<!DOCTYPE html>

<!-- Fig 3.20: autocomplete.html-->
<!-- El nuevo atributo autocomplete y el elemento datalist de formulario de HTML5-->
<hmtl>
    <head>
        <meta charset="utf-8">
        <title>Elnuevo atributo autocomplete y el elemnto datalist de HTML5</title>
    </head>

    <body>
        
        <p>
            <a href="../Index.html">&larr; Volver a la p&aacute;gina anterior</a> | 
            <a href="../../Index.html">Portal Principal</a>
        </p>

        <h1>Demo de autocomplete y datalist</h1>
        <p>Este formulario demuestra el nuevo atributo autocomplete de HTML
            y el elemento datalist.
        </p>

        <!-- activar autocomplete-->
        <form method="post" autocomplete="on">
            <p><label>Primer nombre:
                <input type="text" id="primerNombre"
                placeholder="Primer nombre"/>(Primer nombre)
            </label></p>
            <p><label>Apellido:
                <input type="text" id="apellido"
                placeholder="Apellido"/> (Apellido)
            </label></p>
             <p><label>Email
                <input type="email" id="email"
                placeholder = "nombre@dominio.com"/> (nombre@dominio.com)
            </label></p>
             <p><label for = "listaTexto"> Mes nacimiento:
                <input type="text" id="listaTexto"
                placeholder = "Seleccione un mes" list="meses"/>
                <datalist id="meses">
                    <option value="Enero">
                    <option value="Febrero">
                    <option value="Marzo">
                    <option value="Abril">
                    <option value="Mayo">
                    <option value="Junio">
                    <option value="Julio">
                    <option value="Agostp">
                    <option value="Septiembre">
                    <option value="Octubre">
                    <option value="Noviembre">
                    <option value="Diciembre">
                </datalist>
            </label></p>
            <p><input type="submit" value="Enviar"/>
            <input type="reset" value="Borrar"/></p>
        </form>
    </body>

</hmtl>
