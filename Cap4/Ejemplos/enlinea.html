<!DOCTYPE html> 

<!-- Fig. 4.1: enlinea.html -->
<!-- Uso de estilos en linea -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Estilos en l&aacute;nea</title> 
    </head>
    <body>

        <!-- Enlaces de navegación -->
        <p>
            <a href="../Index.html">&larr; Volver a la p&aacute;gina anterior</a> | 
            <a href="../../Index.html">Portal Principal</a>
        </p>
        <hr>

    <p>Este texto no tiene aplicado ning&uacute;n estilo</p>

    <!-- El atributo style nos permite declarar -->
    <!-- estilos de línea. Debemos separar varias-->
    <!-- propiedades de style con un punto y coma -->
     <p style="font-size: 20pt ; color: deepskyblue;">
        Este texto tiene aplicado los estilos <em> font-size</em> y 
        <em>color</em>, para que sea de
        20pt y de color azul cielo profundo</p>


        <hr>
        <p>
            <a href="../Index.html">&larr; Volver a la p&aacute;gina anterior</a> | 
            <a href="../../Index.html">Portal Principal</a>
        </p>

</body>
</html>
