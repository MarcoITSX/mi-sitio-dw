<!DOCTYPE html> 

<!-- Fig 4.9: posicionamiento.html -->
<!-- Posicionamiento absoluto de los elementos. -->
<html>
    <head>
        <meta charset = "utf-8">
        <title>Posicionamiento absoluto</title>
        <style type = "text/css">
            .imagen_fondo {position: absolute;
                            top: 0px;
                            left: 0px;
                            z-index: 1; }
            .imagen_primerplano  {position: absolute;
                            top: 25px;
                            left: 100px;
                            z-index: 2;}
            .texto         {position: absolute;
                            top: 25px;
                            left: 100px;
                            z-index: 3;
                            font-size: 20pt;
                            font-family: Tahoma, geneva, sans-serif;}
        </style>
    </head>
    <body>

        <!-- Enlaces de navegación -->
        <p>
            <a href="../Index.html">&larr; Volver a la p&aacute;gina anterior</a> | 
            <a href="../../Index.html">Portal Principal</a>
        </p>
        <hr>

        <p><img src = "Imagen/imagen_fondo.png" class= "imagen_fondo" 
            alt= "Primera imagen posicionada"/></p>
        
        <p><img src = "Imagen/imagen_primerplano.png" class = "imagen_primerplano"
            alt= "Segunda imagen posicionada"/></p>   
        
        <p class = "texto">Texto posicionado</p>
    
        <hr>
        <p>
            <a href="../Index.html">&larr; Volver a la p&aacute;gina anterior</a> | 
            <a href="../../Index.html">Portal Principal</a>
        </p>

</body>
</html>
