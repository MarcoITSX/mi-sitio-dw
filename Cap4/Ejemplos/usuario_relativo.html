<!DOCTYPE html>
<!-- Fig. 4.22: usuario_relativo.html -->
<!--Medicion em para el tamaño del texto.-->
<html>
    <head>
        <meta charset="utf-8">
        <title>Estilos de usuario</title>
        <style>
            .nota { font-size: .75em; } /* Medición relativa */
        </style>
    </head>
    <body>
        <p>Gracias por visitar mi sitio Web. Espero que lo disfrute.</p>
        <p class="nota">Nota: Este sitio se moverá pronto. Visite con frecuencia para ver si hay actualizaciones.</p>
    </body>
</html>
