<!DOCTYPE html>

<!-- Fig. 4.14: bordes.hrml-->
<html>
<head>
    <meta charset="UTF-8">
    <title>Bordes</title>
    <style type="text/css">
        div     {text-align: center;
                width: 50%;
                position: relative;
                left: 25%;
                border-width: 6px;}
        .thick  {border-width: thick;}
        .medium {border-width: medium;}
        .thin   {border-width: thin;}
        .solid  {border-style: solid;}
        .double {border-style: double;}
        .groove {border-style: groove;}
        .ridge  {border-style: ridge;}
        .dotted {border-style: dotted;}
        .inset  {border-style: inset; }
        .outset {border-style: outset;}
        .dashed {border-style: dashed;}
        .red    {border-color: red;}
        .blue   {border-color: blue;}
    </style>
</head>
<body>
    <div class="solid">Borde s&oacute;lido</div><hr>
    <div class="double"Doble borde>Doble borde</div>
    <div class="groove">Borde ranurado</div>
    <div class="ridge">Borde rugoso</div>
    <div class="dotted">Borde punteado</div>
    <div class="inset">Borde incrustado</div>
    <div class="thick dashed">Borde grueso intermitente</div>
    <div class="thin red solid">Borde s&oacute;lido rojo delgado</div>
    <div class="medium blue outset">Borde saliente azul mediano</div>
</body>
</html>
