<!DOCTYPE html>

<!-- Fig 5.10: bordeimagen.html -->
<!-- Estirar y repetir una imagen para crer un borde. -->
<html>
<head>
    <meta charset="UTF-8">
    <title>Borde de imagen</title>
    <style type="text/css">
        div
        {
            border-width: 30px;
            border-style: solid;
            width: 234px;
            padding: 20px 20px;
        }
        #stretch
        {
            -webkit-border-image: url(Imagenes/Camello.png) 80 80 80 80 stretch;
            -moz-border-image: url(Imagenes/Camello.png) 80 80 80 80 stretch;
            -o-border-image: url(Imagenes/Camello.png) 80 80 80 80 stretch;
            border-image: url(Imagenes/Camello.png) 80 80 80 80 stretch;
        }
        #repeat
        {
            -webkit-border-image: url(Imagenes/Camello.png) 34% 34% repeat;
            -moz-border-image: url(Imagenes/Camello.png) 34% 34% repeat;
            -o-border-image: url(Imagenes/Camello.png) 34% 34% repeat;
            border-image: url(Imagenes/Camello.png) 34% 34% repeat;
        }
    </style>
</head>
<body>

        <!-- Enlaces de navegación -->
        <p>
            <a href="../Index.html">&larr; Volver a la p&aacute;gina anterior</a> | 
            <a href="../../Index.html">Portal Principal</a>
        </p>
        <hr>

    <h2>Bordes de imagen</h2>
    <img src="Imagenes/Camello.png" alt="Imagen utilizada para demostrar los bordes">
    <p><div id="stretch">Se estira el borde de la imagen</div></p>
    <p><div id="repeat">Se repite el borde de la imagen</div></p>

        <hr>
        <p>
            <a href="../Index.html">&larr; Volver a la p&aacute;gina anterior</a> | 
            <a href="../../Index.html">Portal Principal</a>
        </p>

</body>
</html>
