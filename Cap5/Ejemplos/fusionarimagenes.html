<!DOCTYPE html>

<!-- Fig. 5.14: fusionarimagenes.html -->
<!-- Fusionar una imagen en otra mediante CSS3. -->
<html>
<head>
    <meta charset="utf-8">
    <title>Fusi&oacute;n de im&aacute;genes</title>
    <style type="text/css">
        #portada {
            position: relative;
            margin: 0 auto;
        }

        #portada img {
            position: absolute;
            left: 0;
            -webkit-transition: opacity 4s ease-in-out;
            transition: opacity 4s ease-in-out;
        }

        #portada img.top:hover {
            opacity: 0;
        }
    </style>
</head>
<body>

        <!-- Enlaces de navegación -->
        <p>
            <a href="../Index.html">&larr; Volver a la p&aacute;gina anterior</a> | 
            <a href="../../Index.html">Portal Principal</a>
        </p>
        <hr>

    <div id="portada">
        <img class="bottom" src="Imagenes/jhtp.jpeg" alt="Portada de Java How to program">
        <img class="top" src="Imagenes/cpphtp.jpeg" alt="Portada de C++ How to program">
    </div>

        <hr>
        <p>
            <a href="../Index.html">&larr; Volver a la p&aacute;gina anterior</a> | 
            <a href="../../Index.html">Portal Principal</a>
        </p>

</body>
</html>
