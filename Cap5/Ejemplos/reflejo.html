<!DOCTYPE html>

<!-- Fig. 5.9: reflejo.html-->
<!-- Reflejos en CSS3.-->
<html>
<head>
    <meta charset="UTF-8">
    <title>Reflejo</title>
    <style type="text/css">
        img.below
        {
            -webkit-box-reflect: below 5px
            -webkit-gradient(
                linear, left top, left bottom,
                from(transparent), to(white));
        }
        img.right
        {
            -webkit-box-reflect: right 5px
            -webkit-gradient(
                linear, right top, left top,
                from(transparent), to(white));
        }
    </style>
</head>
<body>

        <!-- Enlaces de navegación -->
        <p>
            <a href="../Index.html">&larr; Volver a la p&aacute;gina anterior</a> | 
            <a href="../../Index.html">Portal Principal</a>
        </p>
        <hr>

    <img class="below" src="Imagenes/jhtp.jpeg" width="138" height="180"
    alt="Portada del libro Java How to Program">
    <img class="right" src="Imagenes/jhtp.jpeg" width="138" height="180" 
    alt="Portada del libro Java How to Program">

        <hr>
        <p>
            <a href="../Index.html">&larr; Volver a la p&aacute;gina anterior</a> |

        </p>

</body>
</html>
