    <head>
        <meta charset="utf-8">
        <title>Ejercicio 5.9 - Capítulo 5</title>
        <style>
            .contenedor {
                width: 200px;
                height: 200px;
                border: 1px dashed gray;
                padding: 10px;
            }

            .cuadrado-animado {
                width: 50px;
                height: 50px;
                background-color: LightCoral;
                border: 2px solid DarkRed;
                position: relative;
                -webkit-animation: patronCuadrado 4s infinite linear;
                -moz-animation: patronCuadrado 4s infinite linear;
                animation: patronCuadrado 4s infinite linear;
            }

            @-webkit-keyframes patronCuadrado {
                0%   { left: 0px;   top: 0px; }
                25%  { left: 100px; top: 0px; }
                50%  { left: 100px; top: 100px; }
                75%  { left: 0px;   top: 100px; }
                100% { left: 0px;   top: 0px; }
            }

            @-moz-keyframes patronCuadrado {
                0%   { left: 0px;   top: 0px; }
                25%  { left: 100px; top: 0px; }
                50%  { left: 100px; top: 100px; }
                75%  { left: 0px;   top: 100px; }
                100% { left: 0px;   top: 0px; }
            }

            @keyframes patronCuadrado {
                0%   { left: 0px;   top: 0px; }
                25%  { left: 100px; top: 0px; }
                50%  { left: 100px; top: 100px; }
                75%  { left: 0px;   top: 100px; }
                100% { left: 0px;   top: 0px; }
            }
        </style>
    </head>
