<!DOCTYPE html>

<!-- Ejercicio 6 autoevaluacion 6.6 -->

<html>
    <head>
        <meta charset="utf-8">
        <title>Autoevaluaci&oacute;n Cap&iacute;tulo 6 - Parte 6</title>
        <script>
            // Calcula el producto de tres enteros
            var x, y, z, resultado;
            var xVal, yVal, zVal;

            // Lee los números del usuario como cadenas
            xVal = window.prompt( "Escriba el primer entero:", "0" );
            yVal = window.prompt( "Escriba el segundo entero:", "0" );
            zVal = window.prompt( "Escriba el tercer entero:", "0" );

            // Convierte los números de cadenas a enteros
            x = parseInt( xVal );
            y = parseInt( yVal );
            z = parseInt( zVal );

            // Calcule el producto
            resultado = x * y * z;

            // Muestra los resultados
            document.writeln( "<h1>El producto es " + resultado + "</h1>" );
        </script>
    </head>
